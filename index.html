<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ying Wa College - SmartDraw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050a07;
      color: #ecfdf5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #143322;
      user-select: none;
    }
    .header-title {
      font-size: 2rem;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 1px;
    }
    .header-subtitle {
      font-size: 1.15rem;
      background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.25rem;
      display: inline-block;
      font-weight: 800;
      cursor: default;
      user-select: none;
    }

    /* Unified Symmetrical 2x2 Grid Layout */
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 680px) {
      .grid-2x2 {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #0d1712;
      border: 1px solid #143322;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
    }
    .panel-top {
      min-height: 220px;
    }
    .panel-bottom {
      height: 55vh;
      min-height: 420px;
    }
    .panel-header {
      font-size: 1rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #143322;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
      font-size: 0.8rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-weight: 700;
    }

    /* Panel 1: Lottery Machine */
    .machine-box {
      flex: 1;
