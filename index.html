<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ying Wa College - SmartDraw</title>
  <!-- Load Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050a07;
      color: #ecfdf5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #143322;
      user-select: none;
    }
    .header-title {
      font-size: 2rem;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 1px;
    }
    .header-subtitle {
      font-size: 1.15rem;
      background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.25rem;
      display: inline-block;
      font-weight: 800;
      cursor: default;
      user-select: none;
    }

    /* Unified Symmetrical 2x2 Grid Layout */
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 680px) {
      .grid-2x2 {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #0d1712;
      border: 1px solid #143322;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
    }
    .panel-top {
      min-height: 220px;
    }
    .panel-bottom {
      height: 55vh;
      min-height: 420px;
    }
    .panel-header {
      font-size: 1rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #143322;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
      font-size: 0.8rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-weight: 700;
    }

    /* Panel 1: Lottery Machine */
    .machine-box {
      flex: 1;
      background: #050a07;
      border: 2px solid #22c55e;
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
      box-shadow: inset 0 0 22px rgba(34, 197, 94, 0.16);
    }
    .rolling-text {
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      line-height: 1.3;
    }
    .rolling-status {
      font-size: 0.85rem;
      color: #86efac;
      margin-top: 0.5rem;
      font-weight: 500;
    }
    .machine-actions {
      display: flex;
      gap: 0.75rem;
    }
    .btn {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.98rem;
      font-weight: 600;
      border: none;
      border-radius: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-draw {
      background: #16a34a;
      color: #ffffff;
      font-size: 1.1rem;
    }
    .btn-draw:hover:not(:disabled) {
      background: #15803d;
    }
    .btn-reset {
      background: #b91c1c;
      color: #ffffff;
    }
    .btn-reset:hover:not(:disabled) {
      background: #991b1b;
    }
    .btn-secondary {
      background: #16261e;
      color: #dcfce7;
      border: 1px solid #1f3a2c;
    }
    .btn-secondary:hover {
      background: #1f3a2c;
    }
    .btn-outline-danger {
      background: #0d1712;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }
    .btn-outline-danger:hover:not(:disabled) {
      background: #450a0a;
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Panel 2: Selection Quota (Capacity & Reserve List) */
    .qty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      flex: 1;
      align-items: center;
    }
    .qty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050a07;
      border: 1px solid #163022;
      border-radius: 0.75rem;
      padding: 0.85rem 0.75rem;
      height: 100%;
    }
    .qty-label-win {
      font-size: 0.92rem;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 0.5rem;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .qty-label-res {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 0.5rem;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .qty-input {
      width: 100%;
      max-width: 160px;
      font-size: 2.15rem;
      font-weight: 700;
      text-align: center;
      padding: 0.45rem;
      border-radius: 0.65rem;
      border: 2px solid #166534;
      background: #0d1712;
      color: #22c55e;
    }
    .qty-input:focus {
      outline: none;
      border-color: #4ade80;
    }
    .qty-input-reserve {
      border-color: #92400e;
      color: #fbbf24;
    }
    .qty-input-reserve:focus {
      border-color: #f59e0b;
    }
    .helper-text {
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
      margin-top: 0.65rem;
      line-height: 1.4;
    }

    /* Panel 3 & 4: Lists & Textarea */
    textarea {
      width: 100%;
      flex: 1;
      background: #050a07;
      color: #ecfdf5;
      border: 1px solid #163022;
      border-radius: 0.65rem;
      padding: 0.75rem;
      font-size: 0.92rem;
      resize: none;
      line-height: 1.6;
    }
    textarea:focus {
      outline: none;
      border-color: #22c55e;
    }

    /* Sorting Controls & Table */
    .sort-controls {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .sort-btn {
      flex: 1;
      padding: 0.45rem;
      font-size: 0.8rem;
      font-weight: 600;
      background: #050a07;
      color: #9ca3af;
      border: 1px solid #163022;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sort-btn.active {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }
    .table-wrapper {
      flex: 1;
      background: #050a07;
      border-radius: 0.65rem;
      overflow-y: auto;
      border: 1px solid #163022;
    }
    .table-actions {
      display: flex;
      gap: 0.65rem;
      margin-top: 0.65rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    thead {
      position: sticky;
      top: 0;
      background: #0d1712;
      z-index: 1;
    }
    th {
      padding: 0.6rem 0.65rem;
      color: #22c55e;
      font-weight: 700;
      border-bottom: 1px solid #163022;
      white-space: nowrap;
    }
    td {
      padding: 0.55rem 0.65rem;
      border-bottom: 1px solid #0d1712;
      color: #ecfdf5;
    }
    tbody tr:hover {
      background: #0d1712;
    }
    .td-status-win {
      color: #4ade80;
      font-weight: 700;
      white-space: nowrap;
    }
    .td-status-res {
      color: #fbbf24;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Custom Toast Notification */
    .toast-banner {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: #0d1712;
      color: #ecfdf5;
      border: 2px solid #22c55e;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
      z-index: 2000;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 0.75rem;
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-box {
      background: #0d1712;
      padding: 1.75rem;
      border-radius: 1rem;
      width: 95%;
      max-width: 960px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      border: 2px solid #22c55e;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.75);
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 0.4rem;
    }
    .modal-desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.1rem;
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.1rem;
    }

    /* High-Contrast Admin Dual Cards */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 680px) {
      .admin-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
    }
    .admin-card-win {
      background: rgba(6, 78, 59, 0.25);
      border: 2px solid #22c55e;
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .admin-card-lose {
      background: rgba(127, 29, 29, 0.25);
      border: 2px solid #ef4444;
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      gap: 0.5rem;
    }
    .tag-win {
      background: #22c55e;
      color: #052e16;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.22rem 0.65rem;
      border-radius: 0.35rem;
      letter-spacing: 0.6px;
    }
    .tag-lose {
      background: #ef4444;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.22rem 0.65rem;
      border-radius: 0.35rem;
      letter-spacing: 0.6px;
    }
    .admin-textarea-win {
      height: 340px;
      min-height: 240px;
      max-height: 48vh;
      background: #040906;
      border: 1px solid #166534;
      color: #dcfce7;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .admin-textarea-win:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.25);
    }
    .admin-textarea-lose {
      height: 340px;
      min-height: 240px;
      max-height: 48vh;
      background: #0c0505;
      border: 1px solid #991b1b;
      color: #fee2e2;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .admin-textarea-lose:focus {
      border-color: #f87171;
      box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.25);
    }
  </style>
</head>
<body>

  <!-- Toast Banner -->
  <div id="toastBanner" class="toast-banner"></div>

  <!-- Header -->
  <header>
    <div class="header-title">Ying Wa College</div>
    <div class="header-subtitle" id="secretSubtitle">SmartDraw</div>
  </header>

  <main class="grid-2x2">
